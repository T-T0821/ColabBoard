[workspace]
resolver = "3"
members = ["crates/board-core", "crates/board-render", "crates/board-web"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
board-core = { path = "crates/board-core" }
board-render = { path = "crates/board-render" }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu", "webgl", "std"] }
log = "0.4"

[profile.release]
lto = true
codegen-units = 1
