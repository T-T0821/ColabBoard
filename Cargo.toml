[workspace]
resolver = "3"
members = [
    "crates/board-core",
    "crates/board-types",
    "crates/board-render",
    "crates/board-web",
    "crates/board-server",
    "crates/board-bench",
    "crates/board-sdk",
    "crates/board-plugin",
    "crates/board-files",
    "tools/cloud-icons",
    "tools/precompress",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
board-core = { path = "crates/board-core" }
board-types = { path = "crates/board-types" }
board-render = { path = "crates/board-render" }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgpu", "webgl", "std"] }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = true
codegen-units = 1
