[package]
name = "cloud-icons"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "AWS / Azure / Google Cloud の公式アイコンパック(ZIP)から構成図用のアイコンを取り込む"
publish = false

[dependencies]
board-core.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
resvg = { version = "0.49", default-features = false, features = ["text"] }
serde_json = "1"
