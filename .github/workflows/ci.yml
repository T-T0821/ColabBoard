name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy (native)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (wasm)
        run: cargo clippy -p board-web --target wasm32-unknown-unknown -- -D warnings
      - name: test
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: trunk build
        working-directory: crates/board-web
        run: trunk build --release
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: crates/board-web/dist

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/gcp/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: fmt
        run: terraform fmt -check -recursive
      - name: validate
        run: terraform init -backend=false -input=false && terraform validate
      - name: deploy.sh
        run: bash -n ../deploy.sh
