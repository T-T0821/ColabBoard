[package]
name = "graboard-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "グラボードのボードをコマンドラインで作る・変換する・書き出す(Web・サーバーと同じ Rust のコア)"

[[bin]]
name = "graboard"
path = "src/main.rs"

[dependencies]
board-core = { workspace = true, features = ["spreadsheet"] }
board-export.workspace = true
graboard-sdk = { path = "../board-sdk" }
tokio = { version = "1.54", features = ["rt", "macros"] }

[features]
default = ["bundled-font"]
# 日本語フォント(Noto Sans JP)をバイナリに入れる。なしでもシステムのフォントを探す。
bundled-font = []

[dev-dependencies]
image.workspace = true
