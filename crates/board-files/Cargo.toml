[package]
name = "board-files"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "重いファイル(PDF・画像・表)を本体のスレッドの外で処理する Web Worker(使うときだけ読み込む別の wasm)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Worker として動かす部品(PDF・表計算の読み取り)。本体(board-web)は画像の縮小だけを使うので外す。
default = ["worker"]
worker = ["dep:hayro", "dep:calamine", "dep:encoding_rs", "dep:board-core"]

[dependencies]
image.workspace = true
hayro = { version = "0.8", default-features = false, optional = true }
calamine = { version = "0.37.0", optional = true }
encoding_rs = { version = "0.8.44", optional = true }
board-core = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }
