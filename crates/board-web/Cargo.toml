[package]
name = "board-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
board-core.workspace = true
board-render.workspace = true
glam.workspace = true
log.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image.workspace = true
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlButtonElement",
    "Node",
    "CssStyleDeclaration",
    "DomRect",
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "Performance",
    "Location",
    "UrlSearchParams",
    "NodeList",
    "DomTokenList",
    "HtmlTextAreaElement",
    "Response",
    "FocusEvent",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "Storage",
    "History",
    "Navigator",
    "Clipboard",
    "AudioContext",
    "BaseAudioContext",
    "AudioNode",
    "AudioParam",
    "AudioDestinationNode",
    "AudioScheduledSourceNode",
    "OscillatorNode",
    "GainNode",
    "RequestInit",
    "Headers",
    "ClipboardEvent",
    "DataTransfer",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "Headers",
    "HtmlSelectElement",
    "HtmlFormElement",
    "MediaQueryList",
    "File",
    "FileList",
    "Blob",
    "DragEvent",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "VisualViewport",
    "MouseEventInit",
    "HtmlMediaElement",
    "HtmlAudioElement",
    "MediaDevices",
    "MediaStream",
    "MediaStreamTrack",
    "MediaStreamConstraints",
    "MediaStreamAudioSourceNode",
    "AnalyserNode",
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnectionIceEvent",
    "RtcTrackEvent",
    "RtcRtpSender",
    "RtcPeerConnectionState",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelEvent",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcIceGatheringState",
    "RtcSessionDescription",
    "MutationObserver",
    "MutationObserverInit",
    "MutationRecord",
    "HtmlVideoElement",
    "MediaRecorder",
    "MediaRecorderOptions",
    "BlobEvent",
    "CanvasRenderingContext2d",
    "CanvasGradient",
] }
# 画像の縮小だけを使う(PDF・表計算の読み取りは Worker 側の別の wasm)。
board-files = { path = "../board-files", default-features = false }
encoding_rs = "0.8.44"
# 直接接続(P2P)の招待リンクを QR コード(SVG)にする。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
