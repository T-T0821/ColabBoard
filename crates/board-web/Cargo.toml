[package]
name = "board-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pdf"]
pdf = ["dep:hayro"]

[dependencies]
board-core.workspace = true
board-render.workspace = true
glam.workspace = true
log.workspace = true
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image.workspace = true
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlButtonElement",
    "Node",
    "CssStyleDeclaration",
    "DomRect",
    "Event",
    "EventTarget",
    "AddEventListenerOptions",
    "PointerEvent",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "Performance",
    "Location",
    "UrlSearchParams",
    "NodeList",
    "DomTokenList",
    "HtmlTextAreaElement",
    "Response",
    "FocusEvent",
    "WebSocket",
    "MessageEvent",
    "BinaryType",
    "Storage",
    "History",
    "Navigator",
    "Clipboard",
    "AudioContext",
    "BaseAudioContext",
    "AudioNode",
    "AudioParam",
    "AudioDestinationNode",
    "AudioScheduledSourceNode",
    "OscillatorNode",
    "GainNode",
    "RequestInit",
    "Headers",
    "ClipboardEvent",
    "DataTransfer",
    "Request",
    "RequestInit",
    "RequestCredentials",
    "Headers",
    "HtmlSelectElement",
    "HtmlFormElement",
    "MediaQueryList",
    "File",
    "FileList",
    "Blob",
    "DragEvent",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "VisualViewport",
    "MouseEventInit",
] }
# PDF の取り込み(Pure Rust のラスタライザ)。wasm が数 MB 増えるので機能で切れるようにする。
hayro = { version = "0.8", default-features = false, optional = true }
