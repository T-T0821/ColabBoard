<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>グラボード</title>
  <link data-trunk rel="rust" data-wasm-opt="s" />
  <link data-trunk rel="css" href="style.css" />
  <link data-trunk rel="copy-dir" href="assets/fonts" />
  <link data-trunk rel="copy-dir" href="assets/cloud-icons" />
  <link data-trunk rel="copy-file" href="sw.js" />
  <script>
    // アプリ本体を端末に置いて、オフラインでも開けるようにする(https か localhost のときだけ動く)。
    if ('serviceWorker' in navigator && !new URLSearchParams(location.search).has('nosw')) {
      addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</head>
<body>
  <canvas id="board" tabindex="0" aria-label="ホワイトボード"></canvas>
  <div id="badges" aria-hidden="true"></div>
  <div id="cursors" aria-hidden="true"></div>
  <textarea id="text-editor" spellcheck="false" aria-label="文字を入力"></textarea>

  <header class="panel hud">
    <a class="brand" href="./" title="ボード一覧">グラボード</a>
    <span id="board-title" data-editable="false"></span>
    <span id="board-role" class="badge" hidden></span>
    <span class="sep"></span>
    <span><span class="label">描画</span> <span id="hud-backend">初期化中…</span></span>
    <span><span class="label">要素</span> <span id="hud-count">0</span></span>
    <span class="sep"></span>
    <span id="hud-net" data-status="connecting">接続中…</span>
    <button id="share" title="このボードを共有">リンクをコピー</button>
    <button id="comments-toggle" title="コメント" aria-pressed="false">コメント</button>
    <button id="history-toggle" title="バージョン履歴" aria-pressed="false" hidden>履歴</button>
    <button id="notif-button" class="icon" title="通知" aria-label="通知"></button>
    <button id="theme-toggle" class="icon" title="ダークモードにする" aria-label="ダークモード" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
    <span id="account"></span>
  </header>

  <div id="comment-pins" aria-label="コメント"></div>
  <section id="comment-popover" class="panel comment-popover" aria-label="コメント" hidden></section>
  <section id="comments-panel" class="panel comments-panel" aria-label="コメント一覧" hidden></section>
  <section id="notif-menu" class="panel notif-menu" aria-label="通知" hidden></section>
  <section id="history-panel" class="panel history-panel" aria-label="バージョン履歴" hidden></section>
  <div id="preview-banner" class="panel preview-banner" role="status" hidden></div>

  <section id="share-panel" class="panel share-panel" aria-label="共有" hidden></section>

  <section class="panel demo" aria-label="性能確認">
    <span class="label">ダミー要素</span>
    <button id="demo-1k">1千</button>
    <button id="demo-10k">1万</button>
    <button id="demo-100k">10万</button>
    <button id="demo-1m">100万</button>
    <button id="demo-clear">初期化</button>
    <label class="check"><input id="continuous" type="checkbox" /> 常時再描画(計測)</label>
    <span id="hud-fps">操作時のみ描画</span>
  </section>

  <nav class="panel toolbar" aria-label="ツール">
    <button id="tool-select" class="tool" title="選択 (V)" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>
    </button>
    <button id="tool-hand" class="tool" title="手のひら (H / Space)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 013 0V11m0-6.5a1.5 1.5 0 013 0V11m0-5a1.5 1.5 0 013 0v7c0 4-2.5 7-6.5 7S5 17 4 14.5l-1-2.5a1.4 1.4 0 012.4-1.4L8 13"/></svg>
    </button>
    <span class="sep"></span>
    <button id="tool-sticky" class="tool" title="付箋 (S)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v11l-5 5H4z M15 20v-5h5"/></svg>
    </button>
    <button id="tool-shape" class="tool" title="図形ライブラリ (R: 四角形 / O: 楕円)" aria-pressed="false" aria-haspopup="true" aria-controls="shape-panel" aria-expanded="false">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="9" height="9" rx="1.5"/><circle cx="16.5" cy="7.5" r="4.5"/></svg>
    </button>
    <button id="tool-text" class="tool" title="テキスト (T)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
    </button>
    <button id="tool-connector" class="tool" title="コネクタ (X)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="19" r="2"/><path d="M6.5 17.5L18 6M13 6h5v5"/></svg>
    </button>
    <button id="tool-pen" class="tool" title="ペン (P)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z M14 7l3 3"/></svg>
    </button>
    <button id="tool-highlighter" class="tool" title="蛍光ペン (M)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M9 15l-3 3h5l1-1M9 15l8-8 3 3-8 8zM4 21h16"/></svg>
    </button>
    <button id="tool-eraser" class="tool" title="消しゴム (E)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M8 20h12M5 15l9-9 5 5-7 7H8z M9.5 10.5l5 5"/></svg>
    </button>
    <div class="tool-group">
      <button id="tool-stamp" class="tool" title="スタンプ・リアクション" aria-pressed="false" aria-haspopup="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 007 0M9 9.5h.01M15 9.5h.01"/></svg>
      </button>
      <div id="stamp-picker" class="popover stamp-picker" role="menu" aria-label="スタンプ・リアクション"></div>
    </div>
    <button id="insert-image" class="tool" title="画像・PDF・マークダウンを挿入(貼り付け・ドロップでも置けます)">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-9 9"/></svg>
    </button>
    <div class="tool-group">
      <button id="templates-button" class="tool" title="テンプレート" aria-haspopup="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><path d="M17.25 14v6.5M14 17.25h6.5"/></svg>
      </button>
      <div id="template-picker" class="popover template-picker" role="menu" aria-label="テンプレート"></div>
    </div>
    <input id="image-file" type="file" accept="image/png,image/jpeg,application/pdf,.pdf,.md,.markdown,text/markdown" multiple hidden>
    <span class="sep"></span>
    <button id="tool-frame" class="tool" title="フレーム (F)" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M7 3v18M17 3v18M3 7h18M3 17h18"/></svg>
    </button>
    <span class="sep"></span>
    <button id="undo" class="tool" title="元に戻す (Ctrl/⌘+Z)" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-2"/></svg>
    </button>
    <button id="redo" class="tool" title="やり直す (Ctrl/⌘+Shift+Z)" disabled>
      <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H9a5 5 0 000 10h2"/></svg>
    </button>
    <span class="sep"></span>
    <div class="swatches" aria-label="色">
      <button class="swatch" data-color="#fff3a3" style="--c:#fff3a3" title="黄"></button>
      <button class="swatch" data-color="#ffd2a8" style="--c:#ffd2a8" title="オレンジ"></button>
      <button class="swatch" data-color="#ffb8c9" style="--c:#ffb8c9" title="ピンク"></button>
      <button class="swatch" data-color="#d3c2ff" style="--c:#d3c2ff" title="紫"></button>
      <button class="swatch" data-color="#b5e3ff" style="--c:#b5e3ff" title="青"></button>
      <button class="swatch" data-color="#c4f0c2" style="--c:#c4f0c2" title="緑"></button>
      <button class="swatch" data-color="#ffffff" style="--c:#ffffff" title="白"></button>
      <button class="swatch" data-color="#1f1f1f" style="--c:#1f1f1f" title="黒"></button>
      <button class="swatch" data-color="#e5484d" style="--c:#e5484d" title="赤"></button>
      <button class="swatch" data-color="#2f6fed" style="--c:#2f6fed" title="青(濃)"></button>
    </div>
  </nav>

  <div id="timer" class="panel timer" role="timer" hidden>
    <span id="timer-text">00:00</span>
    <button id="timer-toggle">一時停止</button>
    <button id="timer-add" title="1 分延長">+1分</button>
    <button id="timer-stop" title="タイマーを消す" aria-label="タイマーを消す">×</button>
  </div>

  <div id="follow-banner" class="panel follow" hidden>
    <span id="follow-text"></span>
    <button id="follow-action">やめる</button>
  </div>

  <details id="collab" class="panel collab">
    <summary>ファシリテーション</summary>
    <section id="template-guide" class="template-guide" hidden>
      <div class="template-guide-head">
        <strong id="template-guide-title"></strong>
        <button id="template-guide-close" aria-label="進め方を閉じる" title="進め方を閉じる">×</button>
      </div>
      <ol id="template-guide-steps"></ol>
    </section>
    <div class="collab-row">
      <span class="label">タイマー</span>
      <button data-timer-min="1">1分</button>
      <button data-timer-min="3">3分</button>
      <button data-timer-min="5">5分</button>
      <button data-timer-min="10">10分</button>
    </div>
    <div class="collab-row">
      <span class="label">投票</span>
      <label>1人 <input id="vote-limit" type="number" min="1" max="99" value="3" /> 票</label>
      <button id="vote-start" title="新しい投票を始める(前の結果は消えます)">開始</button>
      <button id="vote-close">締め切る</button>
      <button id="vote-clear" title="投票と結果を片付ける">片付ける</button>
    </div>
    <p id="vote-status" class="collab-status" data-state="none"></p>
    <ol id="vote-results"></ol>
    <div class="collab-row">
      <span class="label">画面共有</span>
      <button id="present" title="参加者全員の画面をあなたの表示に追従させます">プレゼン開始</button>
    </div>
    <div class="collab-row">
      <span class="label">参加者</span>
      <span id="peer-list" class="peer-list" title="名前を押すとその人の画面をフォロー"></span>
    </div>
    <div class="collab-row" title="選択中の付箋(2 枚以上)、なければボード上の全付箋を並べ直します">
      <span class="label">整理</span>
      <button id="arrange-grid">格子に整列</button>
      <button id="arrange-color">色でまとめる</button>
    </div>
    <div class="collab-row" title="選択中の付箋(2 枚以上)、なければボード上の全付箋が対象です">
      <span class="label">AI</span>
      <button id="ai-summarize">要約</button>
      <button id="ai-cluster">グループ分け</button>
    </div>
    <p id="ai-status" class="collab-status" data-state="none"></p>
  </details>

  <nav class="panel zoom" aria-label="ズーム">
    <button id="zoom-out" aria-label="縮小">−</button>
    <span id="hud-zoom">100%</span>
    <button id="zoom-in" aria-label="拡大">+</button>
    <button id="zoom-fit">全体</button>
  </nav>

  <p class="panel help">スクロール: 移動 ・ Ctrl/⌘+スクロール: ズーム ・ Space+ドラッグ: 移動 ・ Shift: 追加選択/縦横比固定 ・ ダブルクリック/Enter: 文字入力 ・ Delete: 削除 ・ Ctrl/⌘+Z: 元に戻す</p>

  <section id="shape-panel" class="panel shape-panel" aria-label="図形ライブラリ" hidden></section>
  <button id="diagram-toggle" class="panel diagram-toggle" aria-expanded="false" aria-controls="diagram-panel" title="AWS 構成図・フローチャート・生成 AI">構成図・AI</button>
  <section id="diagram-panel" class="panel diagram-panel" aria-label="構成図" hidden>
    <label class="label" for="ai-prompt">生成 AI で図を作る</label>
    <textarea id="ai-prompt" rows="4" placeholder="例: ALB の後ろに EC2 を 2 台(マルチ AZ)、DB は Aurora。画像は S3 から CloudFront で配信"></textarea>
    <div class="diagram-row">
      <select id="ai-mode" aria-label="図の種類">
        <option value="auto">おまかせ</option>
        <option value="aws">AWS 構成図</option>
        <option value="azure">Azure 構成図</option>
        <option value="gcp">Google Cloud 構成図</option>
        <option value="flowchart">フローチャート</option>
      </select>
      <button id="ai-generate" class="primary">生成</button>
    </div>
    <p id="ai-status" class="ai-status" role="status"></p>
    <hr />
    <div class="diagram-row">
      <label class="label" for="diagram-service">部品</label>
      <select id="diagram-service"></select>
      <button id="diagram-add-service">置く</button>
    </div>
    <div class="diagram-row">
      <label class="label" for="diagram-group">枠</label>
      <select id="diagram-group"></select>
      <button id="diagram-add-group">置く</button>
    </div>
    <div class="label">サンプル</div>
    <div id="diagram-samples" class="diagram-samples"></div>
  </section>

  <div id="search-box" class="panel search-box" role="search" hidden>
    <input id="search-input" type="search" placeholder="ボード内を検索" aria-label="ボード内を検索" autocomplete="off">
    <span id="search-count" class="label"></span>
    <button id="search-prev" title="前へ (Shift+Enter)" aria-label="前へ">↑</button>
    <button id="search-next" title="次へ (Enter)" aria-label="次へ">↓</button>
    <button id="search-close" title="閉じる (Esc)" aria-label="閉じる">✕</button>
  </div>
  <div id="format-bar" class="panel format-bar" role="toolbar" aria-label="書式" hidden></div>

  <main id="home" hidden></main>

  <div id="error" role="alert"></div>
</body>
</html>
