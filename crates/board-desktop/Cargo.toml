[package]
name = "board-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
description = "グラボード のデスクトップアプリ(Tauri。Windows / macOS / Linux)"

# Tauri は OS の WebView(Linux では webkit2gtk)を使うので、ほかのクレートとは別のワークスペースにする。
# ルートで `cargo test --workspace` するときに WebView の開発用ライブラリを要らなくするため。
[workspace]

[[bin]]
name = "graboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 同期サーバーをアプリの中で動かす。Web クライアントはバイナリに埋め込む(`embed`)。
board-server = { path = "../board-server", features = ["embed"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
