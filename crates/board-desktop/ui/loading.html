<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>グラボード</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f7fb; --fg: #4a4f63; --accent: #4c5cf5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16171d; --fg: #b9bdd0; --accent: #8c96ff; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  body { display: grid; place-items: center; }
  .box { text-align: center; }
  .spin { width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent); border-top-color: var(--accent);
    animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box"><div class="spin"></div>ボードを開いています…</div>
</body>
</html>
